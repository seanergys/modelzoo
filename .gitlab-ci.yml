# GitLab CI/CD pipeline for seanergys-modelzoo
# Stages: sanity → validate → lint → test → coverage → docs → build → test-wheel
#
# Human-readable reference for every job, rule, and pass/fail decision lives in
# docs/ci-cd.md and is AUTO-GENERATED from this file + the code by
# ci/gen_capabilities_doc.py. If you change a job, rule, or allow_failure here,
# run `make docs-ci` (or let the docs:autogen job regenerate it on the default
# branch). The "why" behind each decision lives in ci/policy.yml.

stages:
  - sanity
  - validate
  - lint
  - test
  - coverage
  - docs
  - build
  - test-wheel

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_VERSION: "2.4.0"
  PYTHONPATH: "${CI_PROJECT_DIR}"
  # Where each test job writes its coverage data file (combined in the coverage stage).
  COVERAGE_DATA_DIR: "$CI_PROJECT_DIR/coverage-data"

# -----------------------------------------------------------------------------
# WORKFLOW — one pipeline per change, and make skipping safe.
# When a branch has an open merge request, ONLY the merge-request pipeline runs.
# That matters because MR pipelines evaluate rules:changes against the TARGET
# branch (the full MR diff), so a job is never skipped just because the latest
# commit happened to touch only an unrelated file. Plain branch pipelines (no MR)
# still run, and the default branch always runs. This removes the branch-pipeline
# "changes vs previous commit" footgun that could skip tests on a merge gate.
# -----------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# -----------------------------------------------------------------------------
# RULE ANCHORS
# Each correctness gate ALWAYS runs on the default branch, and otherwise runs
# when files it depends on change. Combined with the workflow rules above (MR
# pipelines compare changes against the target branch), this makes skipping safe:
# a job is only skipped when the change genuinely does not touch its inputs, and
# never on a merge into the default branch.
#
#   *rules_code        — any source/test/script/dep change (lint, coverage report)
#   *rules_unit        — source, tests/unit, conftest, or deps changed
#   *rules_smoke       — source, tests/smoke, conftest, or deps changed
#   *rules_integration — source, tests/integration, conftest, sample-data, or deps
#   *rules_deps        — only pyproject.toml / poetry.lock changed
#   *rules_wheel       — source or pyproject.toml changed
# No anchor on sanity/validate — always run (cheap, < 10 s).
# -----------------------------------------------------------------------------

.rules_code: &rules_code
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/**/*
        - tests/**/*
        - ci/**/*
        - scripts/**/*
        - pyproject.toml
        - poetry.lock
        - .gitlab-ci.yml
      when: on_success
    - when: never

.rules_unit: &rules_unit
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/**/*
        - tests/unit/**/*
        - tests/conftest.py
        - pyproject.toml
        - poetry.lock
        - .gitlab-ci.yml
      when: on_success
    - when: never

.rules_smoke: &rules_smoke
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/**/*
        - tests/smoke/**/*
        - tests/conftest.py
        - pyproject.toml
        - poetry.lock
        - .gitlab-ci.yml
      when: on_success
    - when: never

.rules_integration: &rules_integration
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/**/*
        - tests/integration/**/*
        - tests/conftest.py
        - scripts/create_sample_data.py
        - pyproject.toml
        - poetry.lock
        - .gitlab-ci.yml
      when: on_success
    - when: never

.rules_deps: &rules_deps
  rules:
    - changes:
        - pyproject.toml
        - poetry.lock
        - .gitlab-ci.yml
      when: on_success
    - when: never

.rules_wheel: &rules_wheel
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/**/*
        - pyproject.toml
        - .gitlab-ci.yml
      when: on_success
    - when: never

# Zenodo connectivity + real-download test. Runs on the default branch (a live
# monitor that Zenodo is reachable and the download→train→predict→save/load path
# works end to end) and whenever the dataset loading code or integration tests
# change (so a change to the download path is validated against real Zenodo).
.rules_zenodo: &rules_zenodo
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - seanergys_modelzoo/datasets/**/*
        - tests/integration/**/*
        - tests/conftest.py
        - .gitlab-ci.yml
      when: on_success
    - when: never

# -----------------------------------------------------------------------------
# CACHE
# Two caches, both keyed on poetry.lock so they invalidate when deps change:
#   *pip_cache — pip download cache (fast wheel reuse)
#   *venv_cache — the resolved .venv itself, so `poetry install` is a near no-op
#                 on a cache hit (this is what removes the real per-job time cost)
# -----------------------------------------------------------------------------
.pip_cache: &pip_cache
  key:
    prefix: "pip-${CI_JOB_IMAGE}"
    files:
      - poetry.lock
  paths:
    - .cache/pip

.venv_cache: &venv_cache
  key:
    prefix: "venv-${CI_JOB_IMAGE}"
    files:
      - poetry.lock
  paths:
    - .venv

# -----------------------------------------------------------------------------
# SHARED INSTALL TEMPLATE
# One in-project .venv with the full ML stack (torch, sklearn, xgboost,
# sentence-transformers, pyarrow). All test jobs share it via the cached .venv.
# (The unit tests import torch/sklearn through the package, so a dev-only venv is
# not sufficient — a single full venv is both correct and simpler to cache.)
#
# torch is reinstalled as CPU-only (python:3.13-slim has no CUDA/NCCL, so the
# default PyPI CUDA wheel fails with undefined-symbol errors). We pin the version
# poetry locked, and skip the reinstall when the cached venv already has +cpu.
# -----------------------------------------------------------------------------
.install_ci:
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
    - <<: *venv_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --with dev,ci
    - |
      if ! poetry run python -c "import torch,sys; sys.exit(0 if torch.__version__.endswith('+cpu') else 1)" 2>/dev/null; then
        TORCH_VER=$(poetry run python -c "import importlib.metadata as m; print(m.version('torch'))")
        echo "Reinstalling torch ${TORCH_VER} as CPU-only..."
        poetry run pip install --quiet --force-reinstall "torch==${TORCH_VER}+cpu" --index-url https://download.pytorch.org/whl/cpu
      else
        echo "Cached venv already has CPU torch — skipping reinstall."
      fi
    - mkdir -p "$COVERAGE_DATA_DIR"

# -----------------------------------------------------------------------------
# STAGE 1: SANITY  (always runs, cheap)
# -----------------------------------------------------------------------------

sanity:python-syntax:
  stage: sanity
  image: python:3.13-slim
  script:
    - find seanergys_modelzoo ci tests scripts -name "*.py" -print0 | xargs -0 -r python -m py_compile
    - echo "✓ Syntax OK"
  allow_failure: false

sanity:check-structure:
  stage: sanity
  image: python:3.13-slim
  script:
    - test -f pyproject.toml
    - test -d seanergys_modelzoo
    - test -d ci
    - test -d tests
    - echo "✓ Repository structure OK"
  allow_failure: false

sanity:check-secrets:
  stage: sanity
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - chmod +x ci/check_secrets.sh
    - ./ci/check_secrets.sh .
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 2: VALIDATE  (always runs)
# -----------------------------------------------------------------------------

validate:yaml-json:
  stage: validate
  image: python:3.13-slim
  script:
    - pip install --quiet pyyaml
    - python ci/validate_yaml.py
    - echo "✓ YAML/JSON OK"
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 3: LINT  (non-blocking quality signal)
# -----------------------------------------------------------------------------

lint:python:
  <<: *rules_code
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet ruff
    - ruff check seanergys_modelzoo ci tests
  allow_failure: true

lint:format:
  <<: *rules_code
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet ruff
    - ruff format --check seanergys_modelzoo ci tests
  allow_failure: true

lint:mypy:
  <<: *rules_code
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet mypy types-PyYAML pydantic
    - mypy seanergys_modelzoo ci tests --ignore-missing-imports --explicit-package-bases
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 4: TEST
# Each layer runs exactly ONCE and emits its own coverage data file
# (coverage-data/.coverage.<job-slug>). The coverage stage combines them, so
# there is no duplicated execution and a failure names its own job.
# -----------------------------------------------------------------------------

# Unit tests — fast, isolated component checks.
test:unit:
  <<: *rules_unit
  extends: .install_ci
  stage: test
  variables:
    COVERAGE_FILE: "$CI_PROJECT_DIR/coverage-data/.coverage.$CI_JOB_NAME_SLUG"
  script:
    - poetry run pytest tests/unit/ -v --tb=short --cov=seanergys_modelzoo --cov-report=
  artifacts:
    when: always
    paths:
      - coverage-data/
    expire_in: 1 day
  allow_failure: false

# Model smoke tests — discovery, instantiation, train-config structure (no data).
test:smoke-models:
  <<: *rules_smoke
  extends: .install_ci
  stage: test
  variables:
    COVERAGE_FILE: "$CI_PROJECT_DIR/coverage-data/.coverage.$CI_JOB_NAME_SLUG"
  script:
    - poetry run pytest tests/smoke/test_smoke_models.py -v --cov=seanergys_modelzoo --cov-report=
  artifacts:
    when: always
    paths:
      - coverage-data/
    expire_in: 1 day
  allow_failure: false

# Data smoke tests — fixture loading and dataset contract (no Zenodo).
test:smoke-data:
  <<: *rules_smoke
  extends: .install_ci
  stage: test
  variables:
    CI_SKIP_ZENODO: "1"
    COVERAGE_FILE: "$CI_PROJECT_DIR/coverage-data/.coverage.$CI_JOB_NAME_SLUG"
  script:
    - poetry run pytest tests/smoke/test_smoke_data.py -v -m "not zenodo" --cov=seanergys_modelzoo --cov-report=
  artifacts:
    when: always
    paths:
      - coverage-data/
    expire_in: 1 day
  allow_failure: false

# Full model×dataset pipeline tests on the COMMITTED sample fixtures (no Zenodo).
# Runs ONLY tests/integration/ (no re-run of unit/smoke). Does NOT regenerate
# fixtures here: scripts/create_sample_data.py downloads full multi-hundred-MB
# Zenodo files into memory and OOM-kills the runner (exit 137). The fixtures in
# tests/fixtures/sample_data/ are committed; run `make sample-data` locally to
# refresh them. A missing fixture makes the integration test fail with a precise
# message telling you to regenerate and commit it.
test:integration:
  <<: *rules_integration
  extends: .install_ci
  stage: test
  variables:
    CI_SKIP_ZENODO: "1"
    COVERAGE_FILE: "$CI_PROJECT_DIR/coverage-data/.coverage.$CI_JOB_NAME_SLUG"
  script:
    - CI_SKIP_ZENODO=1 poetry run pytest tests/integration/ -v -m "not zenodo" --cov=seanergys_modelzoo --cov-report=
  artifacts:
    when: always
    paths:
      - coverage-data/
    expire_in: 1 day
  allow_failure: false

# Zenodo connectivity + real download + train/inference.
# This is the ONE job that actually reaches Zenodo. It runs the @pytest.mark.zenodo
# tests WITHOUT CI_SKIP_ZENODO, so each model downloads a small is_dummy=True subset
# of its real dataset from https://zenodo.org and runs the full train → predict →
# save → load lifecycle on it. The download uses the dataset's memory-safe load path
# (column projection + predicate pushdown via pd.read_parquet(url, columns=, filters=)),
# NOT a whole-file read, so it does not OOM the runner.
#
# allow_failure: true — Zenodo is an external service; a network hiccup or Zenodo
# downtime must NOT block merges. A failure here is a visible (non-blocking) warning
# that connectivity or the real download/train path regressed. Flip to false to make
# it a hard gate (see ci/policy.yml).
test:zenodo:
  <<: *rules_zenodo
  extends: .install_ci
  stage: test
  script:
    - poetry run pytest tests/integration/ -v -m zenodo
  allow_failure: true

# Dependency vulnerability scan (only when deps change).
test:audit:
  <<: *rules_deps
  stage: test
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}" poetry-plugin-export
    - pip install --quiet pip-audit
  script:
    - poetry export -f requirements.txt --without-hashes --with dev,ci -o /tmp/poetry-audit-reqs.txt
    - pip-audit -r /tmp/poetry-audit-reqs.txt
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 5: COVERAGE
# Combine the per-job coverage data into one report. Uses optional needs so the
# job still runs (and combines whatever exists) when some test jobs were skipped
# by their rules.
# -----------------------------------------------------------------------------

coverage:report:
  <<: *rules_code
  stage: coverage
  image: python:3.13-slim
  needs:
    - job: test:unit
      artifacts: true
      optional: true
    - job: test:smoke-models
      artifacts: true
      optional: true
    - job: test:smoke-data
      artifacts: true
      optional: true
    - job: test:integration
      artifacts: true
      optional: true
  before_script:
    - pip install --quiet "coverage[toml]"
  script:
    - mkdir -p coverage
    - |
      if ls coverage-data/.coverage.* >/dev/null 2>&1; then
        coverage combine coverage-data
        coverage xml -o coverage/cobertura-coverage.xml
        coverage report
      else
        echo "No coverage data collected (all test jobs skipped)."
      fi
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 6: DOCS
# Keep docs/ci-cd.md in lockstep with this file + the code.
#   docs:check   — on branches/MRs, warns if the committed doc is stale
#   docs:autogen — on the default branch, regenerates and commits the doc back
# -----------------------------------------------------------------------------

docs:check:
  <<: *rules_code
  extends: .install_ci
  stage: docs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - changes:
        - seanergys_modelzoo/**/*
        - tests/**/*
        - ci/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - poetry run python ci/gen_capabilities_doc.py --check
  allow_failure: true

docs:autogen:
  extends: .install_ci
  stage: docs
  rules:
    # Only on the default branch, and only when a bot token is configured.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCS_BOT_TOKEN'
      when: on_success
    - when: never
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --with dev,ci
  script:
    - git config user.email "ci-bot@seanergys"
    - git config user.name "seanergys-ci-bot"
    - poetry run python ci/gen_capabilities_doc.py
    - |
      if git diff --quiet -- docs/ci-cd.md; then
        echo "docs/ci-cd.md already current — nothing to commit."
      else
        git add docs/ci-cd.md
        git commit -m "docs(ci): regenerate capability tables [skip ci]"
        git push -o ci.skip \
          "https://oauth2:${DOCS_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
          "HEAD:${CI_DEFAULT_BRANCH}"
        echo "✓ Regenerated docs/ci-cd.md pushed to ${CI_DEFAULT_BRANCH}."
      fi
  # Non-blocking: a token/permission hiccup must never break the default branch.
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 7: BUILD
# -----------------------------------------------------------------------------

build:wheel:
  <<: *rules_wheel
  stage: build
  image: python:3.13-slim
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
  script:
    - poetry build --format wheel
    - echo "✓ Built wheel:"
    - ls -lh dist/*.whl
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 8: TEST-WHEEL
# Validate the distributed package installs and imports correctly.
# PYTHONPATH cleared so the installed wheel is tested, not the source tree.
# ci/verify_wheel.py walks every submodule dynamically (no hardcoded import list).
# -----------------------------------------------------------------------------

test:wheel:
  <<: *rules_wheel
  stage: test-wheel
  image: python:3.13-slim
  needs:
    - build:wheel
  variables:
    PYTHONPATH: ""
  script:
    - pip install --quiet dist/*.whl
    - TORCH_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('torch'))")
    - pip install --quiet --force-reinstall "torch==${TORCH_VER}+cpu" --index-url https://download.pytorch.org/whl/cpu
    - python ci/verify_wheel.py
  allow_failure: false
