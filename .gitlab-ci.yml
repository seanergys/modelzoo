# GitLab CI/CD pipeline for seanergys-modelzoo
# Stages: sanity (always) → validate → lint → test
# Runs on GitLab shared runners

stages:
  - sanity
  - validate
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${CI_PROJECT_DIR}:${PYTHONPATH}"

# -----------------------------------------------------------------------------
# CACHE: pip packages for faster builds
# -----------------------------------------------------------------------------
.pip_cache: &pip_cache
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .cache/pip

# -----------------------------------------------------------------------------
# STAGE 1: SANITY (always runs)
# -----------------------------------------------------------------------------
sanity:python-syntax:
  stage: sanity
  image: python:3.11-slim
  script:
    - find seanergys_modelzoo scripts tests -name "*.py" -print0 | xargs -0 -r python -m py_compile
  allow_failure: false

sanity:check-structure:
  stage: sanity
  image: python:3.11-slim
  script:
    - test -f setup.py
    - test -d seanergys_modelzoo
    - test -d scripts
    - echo "Repository structure OK"

# -----------------------------------------------------------------------------
# STAGE 2: VALIDATE (YAML/JSON)
# -----------------------------------------------------------------------------
validate:yaml-json:
  stage: validate
  image: python:3.11-slim
  rules:
    - changes: ["**/*.yml", "**/*.yaml", "**/*.json"]
    - when: always
  script:
    - pip install --quiet pyyaml
    - python ci/validate_yaml.py
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 3: LINT (optional - no ruff/flake8/black configured)
# -----------------------------------------------------------------------------
lint:python:
  stage: lint
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.py"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.py"
    - when: never
  script:
    - pip install --quiet ruff 2>/dev/null || pip install --quiet pyflakes 2>/dev/null || echo "No linter installed, skipping"
    - |
      if command -v ruff &>/dev/null; then
        ruff check seanergys_modelzoo scripts tests --ignore E501 2>/dev/null || true
      elif command -v pyflakes &>/dev/null; then
        pyflakes seanergys_modelzoo scripts tests 2>/dev/null || true
      else
        echo "Lint stage: no linter available (optional)"
      fi
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 4: TEST (runs model validation if possible)
# -----------------------------------------------------------------------------
test:import-check:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet pydantic numpy
    - export PYTHONPATH="${CI_PROJECT_DIR}:${PYTHONPATH}"
  script:
    - python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('Import OK')"
  allow_failure: false

test:validate-models:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - if [ -f ci/requirements-ci.txt ]; then pip install --quiet -r ci/requirements-ci.txt; fi
    - export PYTHONPATH="${CI_PROJECT_DIR}:${PYTHONPATH}"
  script:
    - python scripts/validate_models.py --model-folder seanergys_modelzoo/models
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "seanergys_modelzoo/**/*.py"
        - "scripts/**/*.py"
        - "ci/requirements-ci.txt"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "seanergys_modelzoo/**/*.py"
        - "scripts/**/*.py"
        - "ci/requirements-ci.txt"
    - when: manual
  allow_failure: true
