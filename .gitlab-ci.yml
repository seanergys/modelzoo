# GitLab CI/CD pipeline for seanergys-modelzoo
# Stages: sanity → validate → lint → test → build → test-wheel

stages:
  - sanity
  - validate
  - lint
  - test
  - build
  - test-wheel

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_VERSION: "2.4.0"
  PYTHONPATH: "${CI_PROJECT_DIR}"

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
.pip_cache: &pip_cache
  key:
    prefix: "pip-${CI_JOB_IMAGE}"
    files:
      - poetry.lock
  paths:
    - .cache/pip

# -----------------------------------------------------------------------------
# SHARED TEMPLATES
# -----------------------------------------------------------------------------

# Dev deps only (pytest, ruff, pydantic) — sufficient for unit tests
.install_dev:
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev

# Full ML stack (torch, sklearn, xgboost, sentence-transformers, pyarrow)
# torch is reinstalled as CPU-only after poetry install; python:3.13-slim has no
# CUDA/NCCL, so the default PyPI CUDA wheel fails with undefined symbol errors.
# We pin the same version that poetry locked to avoid a mismatch.
.install_ci:
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
    - TORCH_VER=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('torch'))")
    - pip install --quiet --force-reinstall "torch==${TORCH_VER}+cpu" --index-url https://download.pytorch.org/whl/cpu

# -----------------------------------------------------------------------------
# STAGE 1: SANITY
# -----------------------------------------------------------------------------

sanity:python-syntax:
  stage: sanity
  image: python:3.13-slim
  script:
    - find seanergys_modelzoo ci tests -name "*.py" -print0 | xargs -0 -r python -m py_compile
    - echo "✓ Syntax OK"
  allow_failure: false

sanity:check-structure:
  stage: sanity
  image: python:3.13-slim
  script:
    - test -f pyproject.toml
    - test -d seanergys_modelzoo
    - test -d ci
    - test -d tests
    - echo "✓ Repository structure OK"
  allow_failure: false

sanity:check-secrets:
  stage: sanity
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - chmod +x ci/check_secrets.sh
    - ./ci/check_secrets.sh .
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 2: VALIDATE
# -----------------------------------------------------------------------------

validate:yaml-json:
  stage: validate
  image: python:3.13-slim
  script:
    - pip install --quiet pyyaml
    - python ci/validate_yaml.py
    - echo "✓ YAML/JSON OK"
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 3: LINT
# -----------------------------------------------------------------------------

lint:python:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet ruff
    - ruff check seanergys_modelzoo ci tests
  allow_failure: true

lint:format:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet ruff
    - ruff format --check seanergys_modelzoo ci tests
  allow_failure: true

lint:mypy:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install --quiet mypy types-PyYAML pydantic
    - mypy seanergys_modelzoo ci tests --ignore-missing-imports --explicit-package-bases
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 4: TEST
# -----------------------------------------------------------------------------

# Unit tests with coverage reporting — no ML deps needed
test:unit:
  extends: .install_dev
  stage: test
  script:
    - mkdir -p coverage
    - poetry run pytest tests/unit/ -v
        --cov=seanergys_modelzoo
        --cov-report=xml:coverage/cobertura-coverage.xml
        --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  allow_failure: false

# Model smoke tests — discovery, contract checks, instantiation (no network)
test:smoke:
  extends: .install_ci
  stage: test
  script:
    - poetry run pytest tests/smoke/test_models_smoke.py -v
  allow_failure: false

# Dataset smoke tests — sections 1-3 only (no Zenodo download)
test:smoke-datasets:
  extends: .install_ci
  stage: test
  variables:
    CI_SKIP_ZENODO: "1"
  script:
    - poetry run pytest tests/smoke/test_datasets_smoke.py -v -m "not zenodo"
  allow_failure: false

# Full integration tests with sample fixture data (no Zenodo)
test:integration:
  stage: test
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
    - TORCH_VER=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('torch'))")
    - pip install --quiet --force-reinstall "torch==${TORCH_VER}+cpu" --index-url https://download.pytorch.org/whl/cpu
    - CI_SKIP_ZENODO=1 poetry run python scripts/create_sample_data.py
  script:
    - CI_SKIP_ZENODO=1 poetry run pytest tests/integration/ -v
  allow_failure: false

# Dependency vulnerability scan
test:audit:
  stage: test
  image: python:3.13-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}" poetry-plugin-export
    - poetry config virtualenvs.create false
    - poetry install --no-interaction
    - pip install --quiet pip-audit
  script:
    - poetry export -f requirements.txt --without-hashes --with dev,ci -o /tmp/poetry-audit-reqs.txt
    - pip-audit -r /tmp/poetry-audit-reqs.txt
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 5: BUILD
# -----------------------------------------------------------------------------

build:wheel:
  stage: build
  image: python:3.13-slim
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet "poetry==${POETRY_VERSION}"
  script:
    - poetry build --format wheel
    - echo "✓ Built wheel:"
    - ls -lh dist/*.whl
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 6: TEST-WHEEL
# Validates the distributed package installs and imports correctly.
# PYTHONPATH cleared so the installed wheel is tested, not the source tree.
# -----------------------------------------------------------------------------

test:wheel:
  stage: test-wheel
  image: python:3.13-slim
  needs:
    - build:wheel
  variables:
    PYTHONPATH: ""
  script:
    - pip install --quiet dist/*.whl
    - TORCH_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('torch'))")
    - pip install --quiet --force-reinstall "torch==${TORCH_VER}+cpu" --index-url https://download.pytorch.org/whl/cpu
    - python -c "import seanergys_modelzoo; print('✓ seanergys_modelzoo')"
    - python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('✓ SeanergysLogger')"
    - python -c "from seanergys_modelzoo.models.common.seanergys_model import SeanergysModel; print('✓ SeanergysModel')"
    - python -c "from seanergys_modelzoo.datasets.common.seanergys_dataset import SeanergysDataset; print('✓ SeanergysDataset')"
  allow_failure: false
