# GitLab CI/CD pipeline for seanergys-modelzoo
# Stages: sanity → validate → lint → test
# Runs on GitLab shared runners

stages:
  - sanity
  - validate
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${CI_PROJECT_DIR}:${PYTHONPATH}"

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
.pip_cache: &pip_cache
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .cache/pip

# -----------------------------------------------------------------------------
# STAGE 1: SANITY (always runs)
# -----------------------------------------------------------------------------
sanity:python-syntax:
  stage: sanity
  image: python:3.11-slim
  script:
    - find seanergys_modelzoo ci tests -name "*.py" -print0 | xargs -0 -r python -m py_compile
  allow_failure: false

sanity:check-structure:
  stage: sanity
  image: python:3.11-slim
  script:
    - test -f setup.py
    - test -d seanergys_modelzoo
    - test -d ci
    - test -d tests
    - echo "Repository structure OK"

# -----------------------------------------------------------------------------
# STAGE 2: VALIDATE (YAML/JSON)
# -----------------------------------------------------------------------------
validate:yaml-json:
  stage: validate
  image: python:3.11-slim
  rules:
    - changes: ["**/*.yml", "**/*.yaml", "**/*.json"]
    - when: always
  script:
    - pip install --quiet pyyaml
    - python ci/validate_yaml.py
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 3: LINT
# -----------------------------------------------------------------------------
lint:python:
  stage: lint
  image: python:3.11-slim
  rules:
    - changes: ["**/*.py"]
  script:
    - pip install --quiet ruff
    - ruff check seanergys_modelzoo ci tests --ignore E501
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 4: TEST
# -----------------------------------------------------------------------------
test:unit:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet pytest pydantic
  script:
    - pytest tests/unit/ -v
  rules:
    - changes: ["**/*.py"]
  allow_failure: false

test:smoke:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet pytest pydantic
  script:
    - pytest tests/smoke/ -v
  rules:
    - changes: ["**/*.py"]
  allow_failure: false

test:import-check:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet pydantic numpy
  script:
    - python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('Import OK')"
  allow_failure: false

test:validate-models:
  stage: test
  image: python:3.11-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements-ci.txt
  script:
    - python ci/validate_models.py --model-folder seanergys_modelzoo/models
  rules:
    - changes:
        - "seanergys_modelzoo/models/**"
        - "ci/**"
    - when: always
  allow_failure: true

test:validate-datasets:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet pydantic torch pyarrow
  script:
    - python ci/validate_datasets.py --data-folder seanergys_modelzoo/datasets
  rules:
    - changes:
        - "seanergys_modelzoo/datasets/**"
        - "ci/**"
    - when: always
  allow_failure: true
